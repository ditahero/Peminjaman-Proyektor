<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Peminjaman Proyektor Acer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    padding: 25px;
  }
  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 5px;
  }
  .subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
    font-size: 14px;
  }
  h2 {
    color: #444;
    font-size: 18px;
    margin-bottom: 12px;
    border-left: 4px solid #667eea;
    padding-left: 10px;
  }
  .proyektor-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 25px;
  }
  .card {
    border-radius: 10px;
    padding: 15px;
    color: #fff;
    text-align: center;
    transition: transform .2s;
  }
  .card:hover { transform: translateY(-3px); }
  .card.tersedia { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .card.dipinjam { background: linear-gradient(135deg, #eb3349, #f45c43); }
  .card .nama { font-weight: bold; font-size: 15px; }
  .card .status { font-size: 12px; margin-top: 5px; opacity: .9; }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px;
    border: 1px solid #ddd; border-radius: 6px;
    font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: #667eea; }
  button {
    background: #667eea; color: #fff; border: none;
    padding: 11px 20px; border-radius: 6px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: background .2s;
  }
  button:hover { background: #5568d3; }
  button.kembali {
    background: #f0ad4e; padding: 6px 12px; font-size: 12px;
  }
  button.kembali:hover { background: #e09030; }
  button:disabled { background: #ccc; cursor: not-allowed; }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }

  table {
    width: 100%; border-collapse: collapse; margin-top: 8px;
  }
  th, td {
    padding: 10px; text-align: left; font-size: 13px;
    border-bottom: 1px solid #eee;
  }
  th { background: #f8f9ff; color: #444; font-weight: 600; }
  tr:hover { background: #fafbff; }
  .empty { text-align: center; color: #999; padding: 20px; font-style: italic; }
  .badge-aktif {
    background: #fff0c2; color: #b8860b;
    padding: 3px 8px; border-radius: 10px; font-size: 11px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📽️ Peminjaman Proyektor Acer</h1>
  <p class="subtitle">Kelola peminjaman 4 unit proyektor Acer</p>

  <!-- Status Proyektor -->
  <h2>Status Proyektor</h2>
  <div class="proyektor-list" id="proyektorList"></div>

  <!-- Form Peminjaman -->
  <h2>Form Peminjaman</h2>
  <form id="formPinjam">
    <div class="form-row">
      <div class="form-group">
        <label>Nama Peminjam</label>
        <input type="text" id="nama" placeholder="Nama lengkap" required>
      </div>
      <div class="form-group">
        <label>Keperluan</label>
        <input type="text" id="keperluan" placeholder="Cth: Rapat divisi" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Pilih Proyektor</label>
        <select id="pilihProyektor" required></select>
      </div>
      <div class="form-group">
        <label>Tanggal Pinjam</label>
        <input type="date" id="tanggal" required>
      </div>
    </div>
    <button type="submit">📤 Pinjam Proyektor</button>
  </form>

  <!-- Riwayat Peminjaman -->
  <h2 style="margin-top: 25px;">Riwayat Peminjaman</h2>
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Nama</th>
        <th>Proyektor</th>
        <th>Keperluan</th>
        <th>Tanggal</th>
        <th>Status</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="riwayatBody"></tbody>
  </table>
</div>

<script>
// ============ DATA PROYEKTOR (4 UNIT ACER) ============
const PROYEKTOR = [
  { id: 1, nama: 'Acer X1123H #1' },
  { id: 2, nama: 'Acer X1123H #2' },
  { id: 3, nama: 'Acer X1326AWH #3' },
  { id: 4, nama: 'Acer X1326AWH #4' }
];

// ============ STORAGE ============
function getRiwayat() {
  return JSON.parse(localStorage.getItem('riwayat_proyektor') || '[]');
}
function simpanRiwayat(data) {
  localStorage.setItem('riwayat_proyektor', JSON.stringify(data));
}

// ============ RENDER STATUS ============
function renderStatus() {
  const riwayat = getRiwayat();
  const list = document.getElementById('proyektorList');
  const select = document.getElementById('pilihProyektor');
  list.innerHTML = '';
  select.innerHTML = '';

  PROYEKTOR.forEach(p => {
    const pinjamAktif = riwayat.find(r => r.idProyektor === p.id && r.status === 'Dipinjam');
    const dipinjam = !!pinjamAktif;

    // Card status
    const card = document.createElement('div');
    card.className = 'card ' + (dipinjam ? 'dipinjam' : 'tersedia');
    card.innerHTML = `
      <div class="nama">${p.nama}</div>
      <div class="status">${dipinjam ? '🔴 Dipinjam oleh ' + pinjamAktif.nama : '🟢 Tersedia'}</div>
    `;
    list.appendChild(card);

    // Option form (hanya yang tersedia)
    if (!dipinjam) {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.nama;
      select.appendChild(opt);
    }
  });

  // Jika semua dipinjam
  if (select.options.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = '-- Semua proyektor sedang dipinjam --';
    select.appendChild(opt);
    select.disabled = true;
    document.querySelector('#formPinjam button').disabled = true;
  } else {
    select.disabled = false;
    document.querySelector('#formPinjam button').disabled = false;
  }
}

// ============ RENDER RIWAYAT ============
function renderRiwayat() {
  const riwayat = getRiwayat();
  const tbody = document.getElementById('riwayatBody');
  tbody.innerHTML = '';

  if (riwayat.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Belum ada data peminjaman</td></tr>';
    return;
  }

  riwayat.slice().reverse().forEach((r, i) => {
    const proyektor = PROYEKTOR.find(p => p.id === r.idProyektor);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${riwayat.length - i}</td>
      <td>${r.nama}</td>
      <td>${proyektor ? proyektor.nama : '-'}</td>
      <td>${r.keperluan}</td>
      <td>${r.tanggal}</td>
      <td>${r.status === 'Dipinjam'
            ? '<span class="badge-aktif">Dipinjam</span>'
            : '✅ Dikembalikan'}</td>
      <td>${r.status === 'Dipinjam'
            ? `<button class="kembali" onclick="kembalikan(${r.id})">Kembalikan</button>`
            : '-'}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ============ TAMBAH PEMINJAMAN ============
document.getElementById('formPinjam').addEventListener('submit', function(e) {
  e.preventDefault();

  const nama = document.getElementById('nama').value.trim();
  const keperluan = document.getElementById('keperluan').value.trim();
  const idProyektor = parseInt(document.getElementById('pilihProyektor').value);
  const tanggal = document.getElementById('tanggal').value;

  if (!nama || !keperluan || !idProyektor || !tanggal) {
    alert('Semua data wajib diisi!');
    return;
  }

  const riwayat = getRiwayat();
  riwayat.push({
    id: Date.now(),
    nama,
    keperluan,
    idProyektor,
    tanggal,
    status: 'Dipinjam'
  });
  simpanRiwayat(riwayat);

  // Reset form
  this.reset();
  document.getElementById('tanggal').valueAsDate = new Date();

  renderStatus();
  renderRiwayat();
  alert('✅ Peminjaman berhasil dicatat!');
});

// ============ KEMBALIKAN ============
function kembalikan(id) {
  if (!confirm('Yakin proyektor sudah dikembalikan?')) return;

  const riwayat = getRiwayat();
  const item = riwayat.find(r => r.id === id);
  if (item) {
    item.status = 'Dikembalikan';
    item.tanggalKembali = new Date().toISOString().split('T')[0];
    simpanRiwayat(riwayat);
    renderStatus();
    renderRiwayat();
    alert('✅ Proyektor berhasil dikembalikan!');
  }
}

// ============ INISIALISASI ============
document.getElementById('tanggal').valueAsDate = new Date();
renderStatus();
renderRiwayat();
</script>
</body>
</html>
